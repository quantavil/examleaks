<!doctype html>
<html lang="en-IN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#a4231c" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
		<script>
			// Stamp the theme before first paint so there is no flash.
			(function () {
				try {
					var t = localStorage.getItem('examleaks-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = t;
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
