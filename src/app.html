<!doctype html>
<html lang="en-IN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#a4231c" />
		<meta name="theme-color" content="#f7f5f0" />
		<script>
			// Light is the default; dark is opt-in via the toggle. Stamped before
			// first paint so a returning dark-mode reader sees no flash.
			(function () {
				try {
					if (localStorage.getItem('examleaks-theme') === 'dark') {
						document.documentElement.dataset.theme = 'dark';
					}
				} catch (e) {
					// Storage unavailable — light is already the default.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
