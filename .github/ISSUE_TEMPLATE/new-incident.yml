name: Submit an incident
description: Add an exam leak that is missing from the record. No code needed.
title: '[Incident] '
labels: ['new incident']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to the record. **You do not need to know how to code** — fill in what you have and someone will transcribe it into `exam_leaks.csv`.

        Leave anything you are unsure about blank. A blank field is always better than a guess.

  - type: input
    id: source_url
    attributes:
      label: Source link
      description: One primary link — a named news report, court order, official notice, commission finding or RTI reply. Not a forum post, WhatsApp forward or YouTube claim.
      placeholder: https://…
    validations:
      required: true

  - type: input
    id: exam_name
    attributes:
      label: Which examination?
      description: As named in the source, including the year.
      placeholder: Bihar Police Constable Recruitment Written Exam 2023
    validations:
      required: true

  - type: input
    id: conducting_body
    attributes:
      label: Who conducted it?
      description: The authority that ran the exam, with its acronym if there is one.
      placeholder: Central Selection Board of Constable (CSBC)
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: When?
      description: 'YYYY-MM-DD if the source gives a day. If it only gives a month or a year, say so here — e.g. "June 2022, no exact day".'
      placeholder: 2023-10-01
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Where?
      description: State or "All India", optionally with a district or city.
      placeholder: Bihar (37 districts)
    validations:
      required: true

  - type: dropdown
    id: leak_status
    attributes:
      label: How strong is the evidence?
      description: This describes the evidence, not how bad the allegation is.
      options:
        - Confirmed — an official body, court or police established it
        - Alleged — credible public allegation, FIR/arrests/probe, but no established finding
        - Suspected — authorities acted pre-emptively on suspicion
        - Denied — investigated and officially rejected, or the paper turned out to be fake
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: action_taken
    attributes:
      label: What was done? (tick all the source mentions)
      options:
        - label: The examination was cancelled
        - label: A retest was held
        - label: Arrests were made or an FIR was filed
        - label: An official probe was opened (CBI, SIT, STF, ED…)
        - label: Nothing was reported

  - type: textarea
    id: numbers
    attributes:
      label: Any numbers in the source?
      description: Arrests, convictions, candidates affected. **Leave blank rather than guessing** — blank means "the source does not say", which is different from zero.
      placeholder: |
        Arrests: 148
        Convictions:
        Candidates affected:

  - type: textarea
    id: note
    attributes:
      label: What happened, in a few sentences?
      description: A factual summary of what the source reports. No speculation, and please do not name accused individuals.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: My source is a named news report, court order, official notice or RTI reply — not a rumour or social-media claim.
          required: true
        - label: I have not named any accused individuals.
          required: true
        - label: This is a public examination (government recruitment, entrance, eligibility or school board).
          required: true
