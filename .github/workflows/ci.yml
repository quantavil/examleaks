name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Types, a11y and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      # A malformed CSV row fails here, before anything is published.
      - name: Type & accessibility check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Verify the record built
        run: |
          test -f build/index.html
          test -f build/data/exam-leaks.csv
          test -f build/data/exam-leaks.json
          test -f build/sitemap.xml
          echo "incident pages: $(find build/incident -name '*.html' | wc -l)"
          test "$(find build/incident -name '*.html' | wc -l)" -gt 0
